<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>火土之源</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#F4EFE8;
  --surface:#FFFFFF;
  --surface2:#EDE8E0;
  --text:#1C1C1E;
  --text2:#6B6B71;
  --text3:#AEAEB2;
  --border:rgba(0,0,0,0.09);
  --accent:#B54A2F;
  --cat-color:#888;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}

html,body{
  min-height:100%;
  background:var(--bg);
  font-family:"PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color:var(--text);
}

.shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* TOP BAR */
.topbar{
  padding:calc(var(--safe-top) + 14px) 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}
.back-btn{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--cat-color);
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  padding:6px 0;
}
.back-arrow{font-size:18px;line-height:1}

.lang-btn{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:20px;
  padding:5px 13px;
  font-size:13px;
  font-weight:600;
  color:var(--accent);
  cursor:pointer;
  font-family:inherit;
}

/* CONTENT */
.content{
  flex:1;
  padding:28px 20px calc(var(--safe-bot) + 40px);
  display:flex;
  flex-direction:column;
  gap:0;
}

/* CATEGORY BADGE */
.cat-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.4px;
  color:var(--cat-color);
  background:color-mix(in srgb,var(--cat-color) 10%,#fff);
  border-radius:20px;
  padding:5px 12px 5px 10px;
  margin-bottom:18px;
  border:1.5px solid color-mix(in srgb,var(--cat-color) 22%,transparent);
}

/* QUESTION */
.q-label{
  font-size:11px;font-weight:700;
  color:var(--text3);letter-spacing:0.6px;
  text-transform:uppercase;margin-bottom:10px;
}
.q-main{
  font-size:22px;font-weight:700;
  line-height:1.45;
  color:var(--text);
  margin-bottom:8px;
}
.q-alt{
  font-size:14px;color:var(--text2);
  font-family:Georgia,"Palatino Linotype",serif;
  line-height:1.6;
  margin-bottom:28px;
}

/* DIVIDER */
.divider{
  height:1px;background:var(--border);
  margin-bottom:22px;
}

/* ANSWER */
.a-label{
  font-size:11px;font-weight:700;
  color:var(--text3);letter-spacing:0.6px;
  text-transform:uppercase;margin-bottom:10px;
}
.a-bubble{
  background:var(--surface);
  border-radius:16px;
  padding:18px 18px 16px;
  box-shadow:0 1px 4px rgba(0,0,0,0.07);
  margin-bottom:24px;
  border-left:3.5px solid var(--cat-color);
}
.a-main{
  font-size:16px;line-height:1.75;
  color:var(--text);
  margin-bottom:12px;
}
.a-alt{
  font-size:13px;color:var(--text2);
  font-family:Georgia,serif;line-height:1.65;
  padding-top:12px;
  border-top:1px solid var(--border);
}

/* ACTIONS */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.btn-gpt{
  display:flex;align-items:center;justify-content:center;
  gap:10px;
  background:#19C37D;color:#fff;
  border:none;border-radius:14px;
  padding:16px 20px;
  font-size:16px;font-weight:600;
  cursor:pointer;font-family:inherit;
  text-decoration:none;
  transition:opacity 0.15s;
}
.btn-gpt:active{opacity:0.85}
.btn-gpt-icon{font-size:20px}
.btn-browse{
  display:flex;align-items:center;justify-content:center;
  gap:8px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:14px 20px;
  font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;
  color:var(--text2);
  text-decoration:none;
  transition:background 0.15s;
}
.btn-browse:active{background:var(--surface2)}

/* NOT FOUND */
.not-found{
  text-align:center;
  padding:80px 24px;
  color:var(--text2);
}
.not-found-icon{font-size:48px;margin-bottom:16px}

/* color-mix fallback for older Safari */
@supports not (color:color-mix(in srgb,red 10%,#fff)){
  .cat-badge{background:rgba(136,136,136,0.1);border-color:rgba(136,136,136,0.2)}
  .a-bubble{}
}
.title-calligraphy-sm{
  height:36px;
  width:auto;
  max-width:140px;
  display:block;
  mix-blend-mode:multiply;
  object-fit:contain;
}
</style>
</head>

var SECTIONS = [
  { id:'rail', questions:[
    { zh:'日治時期1899年為何要蓋縱貫鐵道？', en:'Why was the Trans-Taiwan Railway built in 1899 during the Japanese colonial period?', azh:'1899年日本殖民政府開工興建縱貫鐵道，目的是串聯南北，加速稻米、蔗糖等物資運輸與軍事調度，鞏固殖民統治並帶動西部平原的開發。', aen:"Japan's colonial government began the line in 1899 to link north and south, speed up rice and sugar shipments and troop movement, and open up development along the western plain." },
    { zh:'苗栗市的舊山線「功維敘隧道」有何歷史特色？', en:'What are the historical features of the "Gong Weixu Tunnel" on the Old Mountain Line in Miaoli City?', azh:'功維敘隧道完工於1903年，是舊山線最早通車的隧道之一，磚拱工法保存完整，退役後改造為登山步道，洞口題字仍可見當年的漢文匾額。', aen:"Completed in 1903, it was one of the Old Mountain Line's earliest tunnels; its brick-arch construction survives intact and it now serves as a walking trail, its original inscribed plaque still visible." },
    { zh:'為何台灣與日本的鐵道都是「窄軌」而非「標準軌」？', en:'Why do Taiwan and Japan both use "narrow-gauge" railways instead of "standard-gauge" ones?', azh:"日本本土鐵道草創期為節省成本、因應多山地形，選用1067mm窄軌，台灣鐵道由日本技師規劃興建，因此沿用同一套規格與工程慣例。", aen:"Japan's own railways adopted the cheaper, mountain-friendly 1067mm gauge early on, and since Japanese engineers designed Taiwan's network, they carried the same standard over." },
    { zh:'苗栗三義到后里的舊山線鐵道建設耗時五年，此工程有多困難？', en:'The construction of the Old Mountain Line from Sanyi to Houli took five years. Just how difficult was this project?', azh:'這段路線需穿越丘陵地形，開鑿多座隧道並架設高橋，地質破碎加上施工機具簡陋，工程難度極高，是當時全島技術最艱鉅的路段之一。', aen:"The route had to cut through hilly terrain with multiple tunnels and tall bridges; unstable geology and primitive equipment made it one of the island's most technically demanding stretches." },
    { zh:'日治時期舊山線三義到后里的五大工程奇蹟為何？', en:'What were the five engineering marvels of the Old Mountain Line (Sanyi–Houli) during the Japanese colonial period?', azh:"一般指勝興車站、龍騰斷橋、大安溪橋、以及多座長隧道群的開鑿與高架橋工法，展現了當時少見的橋隧並進技術。", aen:"They're generally counted as Shengxing Station, the Longteng Broken Bridge, the Da'an River Bridge, and the long tunnel and viaduct works built together — rare combined bridge-and-tunnel engineering for the era." },
    { zh:'苗栗火車頭園區內最具特色的火車頭，與舊山線鐵道的關係？', en:'What is the connection between the most distinctive locomotive at the Miaoli Locomotive Park and the Old Mountain Line?', azh:'園區內展示的蒸汽機車曾實際行駛於舊山線陡坡路段，是少數保留下來、見證早期山線運煤與客運歷史的實體車輛。', aen:"The steam locomotives on display once ran the Old Mountain Line's steep grades, among the few surviving vehicles that witnessed its early coal and passenger service." },
    { zh:'苗栗已有山線鐵道，為何還要蓋海線鐵道？', en:'Miaoli already has the Mountain Line; why build the Coastal Line as well?', azh:'山線坡陡彎多、運能受限，1922年通車的海線地勢平坦、可跑更快更長的列車，紓解了縱貫線的運輸瓶頸。', aen:"The Mountain Line's steep curves capped capacity; the flatter Coastal Line, opened in 1922, allowed faster, longer trains and relieved the bottleneck." },
    { zh:'「輕便軌道」的軌距規格為何？和縱貫線「窄軌」鐵道運輸方式有何差異？', en:'What is the track gauge for the "Light Rail" system? How does it differ from the narrow-gauge rail transport on the Longitudinal Line?', azh:'輕便軌道多為軌距約610mm的手押台車或小型機車道，載重與速度遠低於縱貫線的1067mm窄軌鐵路，主要服務地方短途貨運。', aen:"The light rail used a narrower ~610mm gauge for hand-push carts and small locomotives, far lower in capacity and speed than the 1067mm trunk line, mainly serving short local freight runs." },
    { zh:'日治時期，苗栗市到出磺坑的「輕便軌道」，主要運送什麼貨物？', en:'During the Japanese colonial period, what goods were primarily transported on the light railway between Miaoli City and Chusangkeng?', azh:'這條輕便軌道主要運送原油、鑽井器材與民生物資，是出磺坑油田對外聯繫的重要生命線。', aen:"It mainly carried crude oil, drilling equipment and daily supplies — a vital lifeline connecting the Chusongkeng oil field to the outside world." },
    { zh:'苗栗市紳「黃南球」，為何有能力興建苗栗市到公館、大湖的「輕便軌道」？', en:'Why was Huang Nanqiu, a gentleman from Miaoli City, able to build the light rail connecting Miaoli City to Gongguan and Dahu?', azh:'黃南球是清末開墾樟腦與茶業致富的地方仕紳，累積雄厚資本與人脈，因而有能力集資興建這條聯繫內山物產的輕便軌道。', aen:"Huang built his fortune in camphor and tea cultivation in the late Qing era, and his capital and connections let him finance this line linking inland goods to market." },
    { zh:'1920年代是苗栗輕便軌道最盛時期，何時開始沒落，被什麼取代？', en:'The 1920s marked the heyday of the Miaoli light rail system. When did its decline begin, and what replaced it?', azh:'1930年代起，隨著公路與汽車運輸興起，輕便軌道逐漸沒落，戰後更被公路客貨運全面取代。', aen:"Decline began in the 1930s as roads and motor transport expanded, and after the war the light rail was fully replaced by road-based freight and passenger service." }
  ]},
  { id:'oil', questions:[
    { zh:'出磺坑是全世界第二古老的油田，那第一座在那？', en:'Chusongkeng is the second-oldest oil field in the world. So where is the oldest one?', azh:'全球公認最古老的油田是美國賓州的泰特斯維爾（Titusville），1859年由「Drake」鑽出第一口商業油井。', aen:"The world's oldest is generally regarded as Titusville, Pennsylvania, where Edwin Drake struck the first commercial oil well in 1859." },
    { zh:'出磺坑在清朝時如何開採石油？', en:'How was oil extracted at Chusongkeng during the Qing Dynasty?', azh:'清朝時期居民多以人工挖掘淺井、以桶汲取地表滲出的油氣，方式原始，產量有限，僅作照明燃料使用。', aen:"In the Qing era, locals dug shallow pits by hand and collected seeping oil in buckets — a crude method with limited output, used mainly for lamp fuel." },
    { zh:'公館人「邱阿玉」在清朝及日治時期，和出磺坑石油有何關係？', en:'What was the connection between "Qiu Ayu," a resident of Gongguan, and the oil discovery in Chusongkeng during the Qing Dynasty and Japanese colonial period?', azh:'邱阿玉相傳是最早在出磺坑一帶發現油苗並嘗試開採的先民，其發現促成後續清廷與日本政府相繼投入正式探勘。', aen:"Qiu Ayu is credited as one of the first settlers to spot oil seepage at Chusongkeng and attempt extraction, a discovery that led both Qing and later Japanese authorities to launch formal exploration." },
    { zh:'出磺坑在日治時期如何開採石油？', en:'How was oil extracted at Chusongkeng during the Japanese colonial period?', azh:'日本政府引進西式頓鑽鑽井技術與專業技師，設立官營油礦，大幅提升鑽井深度與產量，出磺坑因此躍升為正式油田。', aen:"The Japanese introduced Western cable-tool drilling and professional engineers, establishing a state-run oil works that greatly increased well depth and output, formalizing Chusongkeng as an oil field." },
    { zh:'出磺坑為何曾有「小香港」之稱？', en:'Why was Chusongkeng once known as "Little Hong Kong"?', azh:'因油礦興盛時期外地技師、工人大量聚集，商店林立、生活機能繁華，宛如山谷中的小型都市，故有「小香港」美名。', aen:"At its peak the oil works drew workers and engineers from across Taiwan, filling the valley with shops and amenities that felt like a small city — earning it the nickname." },
    { zh:'出磺坑目前仍有在開採石油或天然氣嗎？', en:'Is oil or natural gas still being extracted at Chusongkeng?', azh:'出磺坑至今仍由台灣中油持續開採少量天然氣，是全世界仍在生產、歷史最悠久的油氣田之一。', aen:"CPC still extracts a small amount of natural gas there today, making it one of the world's oldest continuously producing oil and gas fields." }
  ]},
  { id:'fire', questions:[
    { zh:'苗栗地區為何是「中油探採事業部」的起源地？', en:'Why is the Miaoli area the birthplace of the CPC Exploration and Production Division?', azh:"出磺坑油礦自清代起即持續開採，日治官營礦業與戰後中油接手一脈相承，使苗栗成為台灣石油探勘技術與人才的發源地。", aen:"Because Chusongkeng's oil works ran continuously from the Qing era through Japanese state management into postwar CPC operations, Miaoli became the cradle of Taiwan's oil-exploration expertise." },
    { zh:'苗栗市週邊30公里內就有三大油氣井，其功能與特色為何？', en:'There are three major oil and gas wells within a 30-kilometer radius of Miaoli City. What are their functions and characteristics?', azh:'這幾口油氣井分別肩負天然氣生產、地質研究與教育展示功能，部分老井已轉型為文化資產，開放民眾參觀。', aen:"These wells variously serve gas production, geological research and public education; several retired wells have been preserved as heritage sites open to visitors." },
    { zh:'「中油探採事業部」的主要任務為何？', en:"What is the primary mission of the CPC Exploration and Production Division?", azh:'主要任務是負責台灣本島及海域的油氣探勘、鑽井與生產，近年也擴及地熱與碳封存等新能源開發。', aen:"Its core mission is oil and gas exploration, drilling and production onshore and offshore Taiwan, recently expanding into geothermal energy and carbon capture." },
    { zh:'「中油探採事業部」近年推動「碳封存」與「地熱發電」的案例？', en:"What are recent examples of carbon sequestration and geothermal power generation initiatives promoted by CPC's Exploration and Production Division?", azh:'中油利用苗栗枯竭油氣井進行二氧化碳封存試驗，並運用地熱井鑽探經驗開發小型地熱發電示範案場，朝低碳能源轉型。', aen:"CPC has trialed CO₂ injection into depleted Miaoli wells and used its drilling expertise to launch small geothermal demonstration projects, part of a shift toward low-carbon energy." },
    { zh:'苗栗是全台最早鋪設天然氣管線的地方，1970年代管線範圍最遠到那裡？', en:'Miaoli was the first place in Taiwan to have natural gas pipelines installed. How far did the pipeline network extend in the 1970s?', azh:'1970年代苗栗天然氣管線已延伸供應至新竹、台中一帶的工業區，成為台灣早期天然氣工業化利用的重要起點。', aen:"By the 1970s, gas piped from Miaoli reached industrial areas as far as Hsinchu and Taichung, marking an early milestone in Taiwan's industrial gas use." },
    { zh:'「聯合工專」成立前，原址是「中央大學」1963年設立的「地球物理研究所」，與中油探採事業部有何關係？', en:"Before the United Institute of Technology was established, the site was home to the Institute of Geophysics (National Central University, 1963). What is its relationship with CPC's E&P Division?", azh:'該研究所當年與中油合作培育石油地質探勘人才，兩者關係密切，奠定了日後聯合工專設立相關科系的基礎。', aen:"The institute partnered closely with CPC to train petroleum-geology talent, laying the groundwork for related departments at the later technical college." },
    { zh:'「國立聯合大學」前身「聯合工專」，第一任董事長為何是台灣石化工業開拓者「金開英」？', en:"National United University was formerly United Technical College. Why was Jin Kaiying, a pioneer of Taiwan's petrochemical industry, its first chairman?", azh:'金開英長期主持中油探勘與煉製業務，深知石化人才培育的迫切性，因此出任首任董事長，推動學校朝石化與探勘專業發展。', aen:"Jin, who had long overseen CPC's exploration and refining operations, understood the urgent need for petrochemical talent and took the founding chairmanship to steer the school toward that specialty." },
    { zh:'「聯合工專」為何捐給教育部並改制為國立？與「聯合工商教育基金會」的關係為何？', en:'Why was United Technical College donated to the Ministry of Education and reorganized as a national institution? What is its relationship with the United Industrial and Commercial Education Foundation?', azh:'為求長期穩定經營與資源挹注，創辦基金會將學校捐贈教育部改制國立，基金會轉型持續提供獎助學金等教育支持。', aen:"To secure stable, long-term funding, the founding foundation donated the school to the Ministry of Education for national status, and now continues supporting it through scholarships and grants." }
  ]},
  { id:'clay', questions:[
    { zh:'1897年來台的「岩本東作」，爲何被稱爲「苗栗陶之父」？', en:'Why is Tosaku Iwamoto, who came to Taiwan in 1897, known as the "Father of Miaoli Pottery"?', azh:'岩本東作引進日本製陶技術，發現苗栗優質陶土並建立現代化陶窯，開啟苗栗陶業的產業化生產，因而獲此尊稱。', aen:"Iwamoto brought Japanese ceramic techniques, identified Miaoli's high-quality clay, and built modern kilns that industrialized production — earning him the title." },
    { zh:'岩本東作生產的「陶管」與日治時期的縱貫鐵道建設關係為何？', en:'What is the connection between the ceramic pipes produced by Tosaku Iwamoto and the construction of the Longitudinal Railway during the Japanese colonial period?', azh:"縱貫鐵道興建需要大量排水陶管，岩本東作的陶窯正好供應這批建材，使苗栗陶業與鐵道工程緊密連結、共同發展。", aen:"The railway needed large quantities of drainage pipe, and Iwamoto's kilns supplied them — tightly linking Miaoli's pottery industry to the railway's construction." },
    { zh:'日本愛知縣的千年陶都「常滑市」有那些特色與稱號？', en:'What are the distinctive features and nicknames of Tokoname, the thousand-year-old pottery capital in Aichi Prefecture, Japan?', azh:"常滑市以朱泥急須（茶壺）與大型陶管聞名，是日本六大古窯之一，有「陶都」之稱，製陶史超過千年。", aen:"Tokoname is famed for its red-clay teapots and large ceramic pipes, one of Japan's Six Ancient Kilns, with a pottery history spanning over a thousand years." },
    { zh:'「常滑燒」與「苗栗陶」有何相似之處？', en:'What similarities are there between Tokoname-yaki and Miaoli Pottery?', azh:"兩地皆盛產適合製陶的紅土，且都曾以陶管作為早期主力產品，苗栗陶的技術與產品線深受常滑燒直接影響。", aen:"Both regions have abundant red clay suited to pottery and both built early industries on ceramic pipe — Miaoli's techniques and product lines were directly shaped by Tokoname." },
    { zh:'日治時期「陶管」製作的困難之處？', en:'What were the challenges involved in making clay pipes during the Japanese colonial period?', azh:'陶管需承受地下水壓且不能滲漏，成型、乾燥與燒製稍有不慎便會開裂變形，對泥料配比與窯溫控制要求極高。', aen:"Pipes had to withstand groundwater pressure without leaking; any misstep in shaping, drying or firing caused cracking, demanding precise clay mixing and kiln-temperature control." },
    { zh:'苗栗為何能在1960-1970年代，幾乎壟斷台灣的大型甕缸及酒甕市場？', en:"Why was Miaoli able to virtually monopolize Taiwan's market for large earthenware jars and wine jars in the 1960s and 1970s?", azh:"苗栗擁有優質陶土資源與累積數代的手擠胚大型器技術，加上醬油、酒業對大甕的龐大需求，使苗栗窯場產能獨步全台。", aen:"Miaoli's superior clay, generations of hand-forming expertise for large vessels, and strong demand from soy sauce and liquor makers gave its kilns unmatched capacity." },
    { zh:'「銅鑼窯」的手擠胚技術，能製作出多大的甕缸？', en:'How large of a jar can be made using the Tongluo Kiln hand-squeezed clay technique?', azh:'銅鑼窯的老師傅以手擠胚技法，最大能製作出容量上千公升、高度超過一人身高的巨型甕缸。', aen:"Master craftsmen at Tongluo Kiln can hand-form jars over a thousand liters in capacity and taller than an adult, using this squeeze-forming technique." },
    { zh:'苗栗為何能在1970-1980年代，發展出獨特且大規模的裝飾陶瓷產業？', en:'Why was Miaoli able to develop a unique and large-scale decorative ceramics industry in the 1970s and 1980s?', azh:'隨著大甕缸市場需求轉弱，苗栗窯場轉型承接歐美外銷訂單，投入人偶與擺飾陶瓷生產，發展出規模龐大的裝飾陶瓷產業。', aen:"As demand for large jars waned, Miaoli kilns pivoted to export orders from Europe and the US, producing figurines and ornaments that grew into a large decorative-ceramics industry." },
    { zh:'「裝飾陶瓷」人偶製作的困難之處為何？', en:'What are the challenges involved in making "decorative ceramic" figurines?', azh:'人偶需精細的石膏模具灌漿成型，手工上色與細節修坯耗時費工，燒製時尺寸稍大即容易變形或色彩失準。', aen:"Figurines require finely made plaster molds and slip-casting, with time-consuming hand painting and detail work; larger pieces easily warp or misfire in color during kilning." },
    { zh:'裝飾陶瓷時期玩偶的「陶瓷蕾絲」效果，是如何製作出來的？', en:'How was the "ceramic lace" effect on decorative ceramic dolls from that period created?', azh:'工匠將真實蕾絲布浸入陶漿後披覆於坯體，燒製時布料燃燒殆盡，只留下陶土翻模出的精緻蕾絲紋理。', aen:"Craftsmen dipped real lace fabric in liquid clay and draped it over the figure; during firing the fabric burned away, leaving only the delicate lace pattern cast in clay." },
    { zh:'「五鼓文化村」前身是裝飾陶瓷廠，目前的展示空間與創新商品為何？', en:'"Wugu Cultural Village" was formerly a decorative ceramics factory. What are its current exhibition spaces and innovative products?', azh:'五鼓文化村保留舊廠房作為常設展區，展示裝飾陶瓷歷史文物，並開發文創商品與體驗課程吸引遊客參觀。', aen:"Wugu Cultural Village preserves the old factory as a permanent exhibit of decorative-ceramics artifacts, and has developed creative merchandise and hands-on workshops for visitors." },
    { zh:'「東億陶瓷廠」保存了那些陶瓷石膏模製程及創新的捏陶五感體驗？', en:'Does "Dongyi Ceramics Factory" preserve those ceramic plaster mold-making processes and offer an innovative hands-on pottery experience that engages all five senses?', azh:'東億陶瓷廠完整保留石膏模灌漿製程與老設備，並設計結合觸覺、嗅覺與視覺的捏陶體驗課程，讓遊客親手感受陶藝工序。', aen:"Dongyi Ceramics Factory retains its full plaster-mold slip-casting process and vintage equipment, and offers hands-on pottery workshops engaging touch, smell and sight." },
    { zh:'為何文化部工藝中心會在苗栗設立分館，有那些特色？', en:"Why did the Ministry of Culture's Craft Center establish a branch in Miaoli, and what are its unique features?", azh:"苗栗擁有深厚的陶瓷工藝底蘊與匠師群，文化部因此設立分館推廣傳統工藝傳承與創新，並提供駐村與展覽空間。", aen:"Given Miaoli's deep ceramics heritage and pool of craftsmen, the Ministry of Culture set up a branch there to promote traditional-craft preservation and innovation, with residency and exhibition space." },
    { zh:'苗栗縣文觀局營運的公館「陶瓷博物館」，有那些特色？', en:'What are the highlights of the Gongguan "Ceramics Museum," operated by the Miaoli County Bureau of Culture and Tourism?', azh:"館內完整呈現苗栗陶從陶管、甕缸到裝飾陶瓷的產業變遷，並設有DIY體驗區，是了解苗栗陶史的核心場館。", aen:"The museum traces Miaoli pottery's evolution from pipes and jars to decorative ceramics, with a DIY workshop area — the key venue for understanding the region's pottery history." },
    { zh:'苗栗為何在1990年代，成為台灣「柴燒陶」最重要的發展地？', en:'Why did Miaoli become the most important center for the development of wood-fired pottery in Taiwan during the 1990s?', azh:"裝飾陶瓷外銷式微後，部分匠師轉向藝術性更高的柴燒創作，加上苗栗保有充足窯場與燃料林木，促成柴燒陶蓬勃發展。", aen:"As decorative-ceramic exports declined, some craftsmen turned to more artistic wood-firing, and Miaoli's ample kilns and timber fuel supply fueled the style's rise." },
    { zh:'「漢寶窯」在苗栗柴燒陶扮演的角色？', en:'What role does "Hanbao Kiln" play in wood-fired pottery in Miaoli?', azh:"漢寶窯是苗栗柴燒陶的重要推手之一，長年鑽研窯溫與落灰技法，培育出多位知名柴燒創作者。", aen:"Hanbao Kiln is a key driver of Miaoli's wood-firing tradition, long refining kiln-temperature and ash-glaze techniques and mentoring several noted wood-fire artists." },
    { zh:'「柴燒陶」迷人的金屬光澤（金銀彩）與火刺現象，是如何形成的？', en:'How are the captivating metallic luster (gold and silver glazes) and the "fire spots" of "wood-fired" pottery formed?', azh:"窯燒時木材灰燼落於坯體表面，與陶土礦物在高溫下產生自然釉化反應，火焰流動路徑則在表面留下深淺不一的火刺痕。", aen:'Wood ash falling on the surface reacts with the clay\'s minerals at high heat to form natural glaze, while the flame\'s path leaves the varied "fire spot" markings.' },
    { zh:'「金龍窯」擅長那些柴燒、庭院陶具開發以及客製化陶器代工？', en:'Does "Golden Dragon Kiln" specialize in wood-fired pottery, the development of garden pottery, and custom pottery manufacturing?', azh:'金龍窯以傳統柴燒技法見長，同時開發庭院造景陶器與大型客製化陶製品，兼顧藝術性與實用市場需求。', aen:"Golden Dragon Kiln is known for traditional wood-firing, while also developing garden ornamental pottery and large custom-made pieces, balancing artistic and practical demand." }
  ]}
];

// ─── FLATTEN ──────────────────────────────────────────────────────
var ALL_Q = {};
SECTIONS.forEach(function(sec) {
  sec.questions.forEach(function(q, i) {
    ALL_Q[sec.id+'_'+i] = Object.assign({ cat: sec.id }, q);
  });
});

function catInfo(id) {
  return CATEGORIES.find(function(c){ return c.id===id; }) || { color:'#888', icon:'❓', zh:id, en:id };
}

// ─── STATE ────────────────────────────────────────────────────────
var lang = 'zh';
var currentQ = null;
var currentId = null;

// ─── RENDER ───────────────────────────────────────────────────────
function render() {
  var id = currentId;
  var q  = currentQ;
  var cat = catInfo(q.cat);
  var color = cat.color;

  // Apply cat color to CSS var
  document.documentElement.style.setProperty('--cat-color', color);

  var mainQ = lang==='zh' ? q.zh  : q.en;
  var altQ  = lang==='zh' ? q.en  : q.zh;
  var mainA = lang==='zh' ? q.azh : q.aen;
  var altA  = lang==='zh' ? q.aen : q.azh;
  var catLabel = lang==='zh' ? cat.zh : cat.en;

  var gptText = lang==='zh' ? q.zh : q.en;
  var gptUrl  = 'https://chatgpt.com/?q=' + encodeURIComponent(gptText);

  document.getElementById('backLabel').textContent = lang==='zh' ? '全部問題' : 'All questions';
  document.getElementById('langBtn').textContent   = lang==='zh' ? 'EN' : '中文';
  document.documentElement.lang = lang==='zh' ? 'zh-TW' : 'en';

  document.getElementById('content').innerHTML =
    '<div class="cat-badge">'+cat.icon+' '+catLabel+'</div>'

    +'<div class="q-label">'+(lang==='zh' ? '展覽問題' : 'Exhibition Question')+'</div>'
    +'<div class="q-main">'+mainQ+'</div>'
    +'<div class="q-alt">'+altQ+'</div>'

    +'<div class="divider"></div>'

    +'<div class="a-label">'+(lang==='zh' ? '簡要解答' : 'Quick Answer')+'</div>'
    +'<div class="a-bubble">'
    +'<div class="a-main">'+mainA+'</div>'
    +'<div class="a-alt">'+altA+'</div>'
    +'</div>'

    +'<div class="actions">'
    +'<a class="btn-gpt" href="'+gptUrl+'" target="_blank" rel="noopener">'
    +'<span class="btn-gpt-icon">🤖</span>'
    +(lang==='zh' ? '用 ChatGPT 深入探索這個問題' : 'Explore further with ChatGPT')
    +'</a>'
    +'<a class="btn-browse" href="index.html">'
    +'&#8592; '+(lang==='zh' ? '返回瀏覽全部 43 道問題' : 'Browse all 43 questions')
    +'</a>'
    +'</div>';
}

function renderNotFound() {
  document.getElementById('content').innerHTML =
    '<div class="not-found">'
    +'<div class="not-found-icon">🔍</div>'
    +'<div>找不到這道問題<br><small style="color:var(--text3)">Question not found</small></div>'
    +'<br><a class="btn-browse" href="index.html" style="display:inline-flex;margin-top:12px">← 返回全部問題</a>'
    +'</div>';
}

function toggleLang() {
  lang = lang==='zh' ? 'en' : 'zh';
  if (currentQ) render(); else renderNotFound();
}

// ─── INIT ─────────────────────────────────────────────────────────
(function() {
  try {
    var params = new URLSearchParams(window.location.search);
    currentId = params.get('id') || params.get('q');
  } catch(e) {}

  if (currentId && ALL_Q[currentId]) {
    currentQ = ALL_Q[currentId];
    render();
  } else {
    renderNotFound();
  }
})();
</script>
</body>
</html>
