// ── URL builder ────────────────────────────────────────────────────
function chatGPTUrl(zh) {
  return 'https://chatgpt.com/?q=' + encodeURIComponent(zh);
}

// ── Build question numbers globally ───────────────────────────────
let globalNum = 0;
SECTIONS.forEach(s => s.questions.forEach(q => { globalNum++; q.num = globalNum; }));

// ── Render main sections ───────────────────────────────────────────
const main = document.querySelector('main');

SECTIONS.forEach(sec => {
  const section = document.createElement('section');
  section.className = 'section';
  section.id = 'sec-' + sec.id;
  section.dataset.cat = sec.id;

  section.innerHTML = `
    <div class="section-header">
      <div class="section-badge" style="background:${sec.color}"></div>
      <h2 class="section-title">${sec.title}</h2>
      <span class="section-count">${sec.questions.length} 題</span>
    </div>
    <div class="q-list" id="list-${sec.id}"></div>
  `;
  main.appendChild(section);

  const list = section.querySelector('.q-list');

  sec.questions.forEach(q => {
    const a = document.createElement('a');
    a.className = 'q-card';
    a.href = chatGPTUrl(q.zh);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.dataset.zh = q.zh;
    a.dataset.en = q.en;
    a.dataset.cat = sec.id;
    a.innerHTML = `
      <div class="q-accent" style="background:${sec.color}"></div>
      <div class="q-body">
        <div class="q-num">Q${String(q.num).padStart(2,'0')}</div>
        <div class="q-zh">${q.zh}</div>
        <div class="q-en">${q.en}</div>
      </div>
      <div class="q-arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </div>
    `;
    list.appendChild(a);
  });
});

// ── Category filter ────────────────────────────────────────────────
const pills = document.querySelectorAll('.cat-pill');
let activeCat = 'all';

pills.forEach(pill => {
  pill.addEventListener('click', e => {
    e.preventDefault();
    activeCat = pill.dataset.cat;
    pills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');

    // scroll to section if specific cat
    if (activeCat !== 'all') {
      const sec = document.getElementById('sec-' + activeCat);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    applyFilters();
  });
});

// ── Search ─────────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', applyFilters);

function applyFilters() {
  const term = searchInput.value.trim().toLowerCase();
  const cards = document.querySelectorAll('.q-card');
  const sections = document.querySelectorAll('.section');
  let anyVisible = false;

  cards.forEach(card => {
    const matchCat = activeCat === 'all' || card.dataset.cat === activeCat;
    const matchSearch = !term ||
      card.dataset.zh.toLowerCase().includes(term) ||
      card.dataset.en.toLowerCase().includes(term);
    const show = matchCat && matchSearch;
    card.hidden = !show;
    if (show) anyVisible = true;
  });

  // Hide sections with no visible cards
  sections.forEach(sec => {
    const hasVisible = [...sec.querySelectorAll('.q-card')].some(c => !c.hidden);
    sec.hidden = !hasVisible;
  });

  document.getElementById('noResults').style.display = anyVisible ? 'none' : 'block';
}

// ── URL Modal ──────────────────────────────────────────────────────
const modalOverlay = document.getElementById('modalOverlay');
const modalBody    = document.getElementById('modalBody');

function buildModal() {
  modalBody.innerHTML = '';
  SECTIONS.forEach(sec => {
    const ms = document.createElement('div');
    ms.className = 'modal-section';
    ms.innerHTML = `<div class="modal-section-title" style="color:${sec.color}">${sec.title}</div>`;

    sec.questions.forEach(q => {
      const url = chatGPTUrl(q.zh);
      const row = document.createElement('div');
      row.className = 'url-row';
      row.innerHTML = `
        <span class="url-qnum">Q${String(q.num).padStart(2,'0')}</span>
        <div class="url-content">
          <div class="url-qtext">${q.zh}</div>
          <a class="url-link" href="${url}" target="_blank" rel="noopener">${url}</a>
        </div>
        <button class="btn url-copy" data-url="${url}">複製</button>
      `;
      ms.appendChild(row);
    });
    modalBody.appendChild(ms);
  });

  // Copy individual URL
  modalBody.querySelectorAll('.url-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        btn.textContent = '✓ 已複製';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 1500);
      });
    });
  });
}

document.getElementById('btnLinks').addEventListener('click', () => {
  buildModal();
  modalOverlay.classList.add('open');
});

document.getElementById('btnClose').addEventListener('click', () => {
  modalOverlay.classList.remove('open');
});

modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('open');
});

// Copy all URLs
document.getElementById('btnCopyAll').addEventListener('click', () => {
  let text = '';
  SECTIONS.forEach(sec => {
    text += `\n【${sec.title}】\n`;
    sec.questions.forEach(q => {
      text += `Q${String(q.num).padStart(2,'0')}. ${q.zh}\n${chatGPTUrl(q.zh)}\n\n`;
    });
  });
  navigator.clipboard.writeText(text.trim()).then(() => showToast('✓ 已複製全部 43 個連結'));
});

// ── Toast ──────────────────────────────────────────────────────────
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ── Theme toggle ───────────────────────────────────────────────────
const btnTheme = document.getElementById('btnTheme');
const iconTheme = document.getElementById('iconTheme');

const sunSVG = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>`;
const moonSVG = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

let theme = (() => {
  try { return localStorage.getItem('huotu-theme') || 'system'; } catch { return 'system'; }
})();

function applyTheme(t) {
  theme = t;
  if (t === 'dark') {
    document.documentElement.setAttribute('data-theme','dark');
    iconTheme.innerHTML = sunSVG;
  } else if (t === 'light') {
    document.documentElement.setAttribute('data-theme','light');
    iconTheme.innerHTML = moonSVG;
  } else {
    document.documentElement.removeAttribute('data-theme');
    iconTheme.innerHTML = moonSVG;
  }
  try { localStorage.setItem('huotu-theme', t); } catch {}
}

applyTheme(theme);

btnTheme.addEventListener('click', () => {
  const next = theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
});
</script>
